name: Deploy to EC2

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Github Repository 파일 불러오기
        uses: actions/checkout@v4

      - name: JDK 17 설치
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Gradle 실행 권한 부여
        run: chmod +x gradlew

      - name: 테스트 및 빌드
        run: ./gradlew clean build

      - name: Docker Hub 로그인
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Docker 이미지 빌드 및 Push
        run: |
          docker buildx build \
          --platform linux/arm64 \
          -t ${{ secrets.DOCKER_USERNAME }}/member-api:latest \
          --push .

      - name: EC2 서버 배포
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_KEY }}
          script: |
            sudo docker stop member-api || true
            sudo docker rm member-api || true

            sudo docker pull ${{ secrets.DOCKER_USERNAME }}/member-api:latest

            sudo docker run -d \
            -p 8080:8080 \
            --name member-api \
            ${{ secrets.DOCKER_USERNAME }}/member-api:latest